name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Builds the same files a release would ship, so packaging is proven on every pull request.
  package:
    needs: test
    uses: ./.github/workflows/package.yml
    with:
      version: dev

  # Builds the server image for amd64 and arm64 and smoke-tests it; nothing is pushed from CI.
  docker:
    needs: test
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write # checked up front for the reusable workflow, only used when push is true
    with:
      version: dev
