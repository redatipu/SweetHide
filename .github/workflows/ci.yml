name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    # Core, CLI and view models (SweetHide.Portable.slnf) build and test on both platforms.
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SweetHide.Portable.slnf

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          dotnet format SweetHide.Portable.slnf --verify-no-changes --no-restore
          dotnet format whitespace --folder --verify-no-changes --include src/SweetHide.App

      - name: Build
        run: dotnet build SweetHide.Portable.slnf -c Release --no-restore

      - name: Test
        run: dotnet test --solution SweetHide.Portable.slnf -c Release --no-build

  windows-app:
    # The WinUI 3 app needs the Windows-only XAML compiler.
    name: Windows app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish (self-contained, unpackaged)
        run: dotnet publish src/SweetHide.App -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.platform }} -o publish/SweetHide-win-${{ matrix.arch }}

      - name: Smoke test (launch, drive every page, screenshots)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/SweetHide-win-x64/SweetHide.exe").Path
          foreach ($run in @(@{ lang = 'th'; theme = 'light' }, @{ lang = 'en'; theme = 'dark' })) {
            $out = Join-Path (Get-Location) "screenshots/$($run.lang)-$($run.theme)"
            New-Item -ItemType Directory -Force $out | Out-Null
            $p = Start-Process $exe -ArgumentList '--smoke-test', "`"$out`"", '--lang', $run.lang, '--theme', $run.theme -PassThru
            $null = $p.Handle # keeps ExitCode available after exit
            if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "Smoke test ($($run.lang)/$($run.theme)) timed out" }
            if ($p.ExitCode -ne 0) {
              Get-Content (Join-Path $out 'error.txt') -ErrorAction SilentlyContinue
              throw "Smoke test ($($run.lang)/$($run.theme)) failed with exit code $($p.ExitCode)"
            }
            Get-ChildItem $out -Filter *.png | Format-Table Name, Length
          }

      - name: Upload screenshots
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v5
        with:
          name: SweetHide-screenshots
          path: screenshots
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v5
        with:
          name: SweetHide-win-${{ matrix.arch }}
          path: publish/SweetHide-win-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

  publish-cli:
    name: Publish CLI (${{ matrix.rid }})
    needs: build-test
    strategy:
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish self-contained single file
        run: dotnet publish src/SweetHide.Cli -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v5
        with:
          name: sweethide-cli-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 14
